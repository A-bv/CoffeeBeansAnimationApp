<!doctype html>
<html><head><meta charset="utf-8"></head>
<body style="margin:0;background:#000">
<canvas id="out"></canvas>
<img id="beans" src="../../../CoffeeBeansAnimationApp/Assets.xcassets/beansGlassNoB.imageset/beansGlassNoB.png">
<img id="bean" src="../../../CoffeeBeansAnimationApp/Assets.xcassets/clearBean.imageset/clearBean.png">
<script>
// Canvas re-creation of the SwiftUI demos, used only to record README previews.
// Every number below mirrors the Swift source (sizes, colors, durations, curves).
const W = 390, H = 760;                // logical points (iPhone-ish)
const OUT_W = 280;                     // output pixels
const S = OUT_W / W;
const OUT_H = Math.round(H * S);
const FONT = '"Liberation Sans", "DejaVu Sans", sans-serif';

// ---------- helpers ----------
function rng(seed) { // mulberry32
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const rand = (r, a, b) => a + r() * (b - a);
function bezier(x1, y1, x2, y2) {
  return x => { if (x <= 0) return 0; if (x >= 1) return 1;
    let lo = 0, hi = 1, t = x;
    for (let i = 0; i < 40; i++) { t = (lo + hi) / 2;
      const cx = 3*x1*t*(1-t)**2 + 3*x2*t*t*(1-t) + t**3;
      if (cx < x) lo = t; else hi = t; }
    return 3*y1*t*(1-t)**2 + 3*y2*t*t*(1-t) + t**3; };
}
const easeInOut = bezier(0.42, 0, 0.58, 1);
const easeOut = bezier(0, 0, 0.58, 1);
const spring = t => t <= 0 ? 0 : 1 - (1 + 12.6 * t) * Math.exp(-12.6 * t); // ~.smooth
const lerp = (a, b, p) => a + (b - a) * p;
// .repeatForever(autoreverses: true).delay(d)
function pingPong(t, dur, delay, ease) {
  if (t < delay) return 0;
  const k = (t - delay) / dur, n = Math.floor(k), f = k - n;
  return ease(n % 2 === 0 ? f : 1 - f);
}
// .repeatForever(autoreverses: false).delay(d)
function loop(t, dur, delay, ease) {
  if (t < delay) return 0;
  const k = (t - delay) / dur; return ease(k - Math.floor(k));
}
const rgb = (r, g, b, a = 1) => `rgba(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)},${a})`;
function capsule(ctx, cx, cy, w, h) {
  const r = Math.min(w, h) / 2;
  ctx.beginPath(); ctx.roundRect(cx - w/2, cy - h/2, w, h, r); ctx.fill();
}
function wrap(ctx, text, maxW) {
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  lines.push(line); return lines;
}
const BROWN = 'rgb(162,132,94)';      // SwiftUI .brown (light)

// SF Symbol "cup.and.saucer.fill" approximation, fitted in a w x w box.
function cupAndSaucer(ctx, cx, cy, w, color) {
  const u = w / 100; ctx.save(); ctx.translate(cx, cy); ctx.fillStyle = color;
  // cup body
  ctx.beginPath();
  ctx.moveTo(-40*u, -30*u); ctx.lineTo(28*u, -30*u);
  ctx.bezierCurveTo(28*u, 5*u, 18*u, 20*u, -6*u, 20*u);
  ctx.bezierCurveTo(-30*u, 20*u, -40*u, 5*u, -40*u, -30*u);
  ctx.fill();
  // handle
  ctx.lineWidth = 7*u; ctx.strokeStyle = color; ctx.beginPath();
  ctx.ellipse(31*u, -14*u, 11*u, 11*u, 0, -Math.PI/2, Math.PI/2); ctx.stroke();
  // saucer
  ctx.beginPath(); ctx.roundRect(-50*u, 25*u, 100*u, 8*u, 4*u); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-30*u, 33*u, 60*u, 5*u, 2.5*u); ctx.fill();
  ctx.restore();
}

// ---------- CoffeeArtBackgroundView ----------
const ART = [[0.08,0.04,0.02],[0.18,0.1,0.05],[0.3,0.18,0.1],[0.5,0.3,0.2]];
function makeCircles(seed) {
  const r = rng(seed), out = [];
  for (const large of [true, false]) for (let i = 0; i < (large ? 20 : 10); i++) out.push({
    x: r(), y: r(),
    size: large ? rand(r, 40, 150) : rand(r, 20, 50),
    color: ART[Math.floor(r() * 4)],
    opacity: large ? rand(r, 0.05, 0.25) : rand(r, 0.15, 0.4),
    blur: large ? rand(r, 20, 60) : rand(r, 5, 20),
    target: large ? rand(r, 0.5, 2.0) : rand(r, 0.5, 1.5),
    dur: large ? rand(r, 4, 8) : rand(r, 6, 12),
    delay: rand(r, 0, 3),
  });
  return out;
}
const CIRCLES = makeCircles(7);
function drawArt(ctx, t) {
  const p = pingPong(t, 30, 0, x => x); // .linear(30).repeatForever(autoreverses: true)
  const sx = 0, sy = lerp(0, H, p), ex = W, ey = lerp(H, 0, p);
  const g = ctx.createLinearGradient(sx, sy, ex, ey);
  ART.forEach((c, i) => g.addColorStop(i / 3, rgb(...c)));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const c of CIRCLES) {
    const s = lerp(1, c.target, pingPong(t, c.dur, c.delay, easeInOut));
    ctx.save(); ctx.filter = `blur(${c.blur * S}px)`; ctx.globalAlpha = c.opacity;
    ctx.fillStyle = rgb(...c.color); ctx.beginPath();
    ctx.arc(c.x * W, c.y * H, c.size * s / 2, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
}

// ---------- Coffee Shop (MainView) ----------
function lShape(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w - 60, h, r);
  ctx.roundRect(x, y, w, h - 60, r);
  ctx.moveTo(x + w - 60, y + h - 60); ctx.lineTo(x + w - 30, y + h - 60);
  ctx.quadraticCurveTo(x + w - 55, y + h - 55, x + w - 60, y + h - 30);
  ctx.closePath();
}
function drawOption(ctx, x, top, w, name, desc, price) {
  // .padding(.top, 60) then .padding(10) around the card body
  const bx = x + 10, by = top + 60 + 10, bw = w - 20;
  ctx.font = `bold 15px ${FONT}`;
  const lines = wrap(ctx, desc, bw - 32);
  const bh = 16 + 50 + 20 + 5 + Math.max(72, lines.length * 18) + 24 + 20 + 16;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.33)'; ctx.shadowBlur = 10 * S;
  ctx.fillStyle = 'rgba(255,255,255,0.13)'; lShape(ctx, bx, by, bw, bh, 20); ctx.fill('nonzero');
  ctx.restore();
  // arrow.right.circle.fill (Chocolat)
  const ax = bx + bw - 27.5, ay = by + bh - 27.5;
  ctx.fillStyle = 'rgb(112,74,51)'; ctx.beginPath(); ctx.arc(ax, ay, 21, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(ax - 9, ay); ctx.lineTo(ax + 9, ay);
  ctx.moveTo(ax + 1, ay - 8); ctx.lineTo(ax + 9, ay); ctx.lineTo(ax + 1, ay + 8); ctx.stroke();
  // text
  let ty = by + 16 + 50;
  ctx.textBaseline = 'top'; ctx.fillStyle = 'rgb(242,242,247)'; ctx.font = `bold 17px ${FONT}`;
  ctx.fillText(name, bx + 16, ty); ty += 20 + 5;
  ctx.fillStyle = 'rgb(209,209,214)'; ctx.font = `15px ${FONT}`;
  lines.forEach((l, i) => ctx.fillText(l, bx + 16, ty + i * 18));
  ty += Math.max(72, lines.length * 18) + 24;
  ctx.fillStyle = 'rgb(242,242,247)'; ctx.font = `bold 17px ${FONT}`; ctx.fillText(`${price} USD`, bx + 16, ty);
  // Image, 100pt tall, clipped to a circle, sitting on the card's top edge
  const img = document.getElementById('beans');
  ctx.save(); ctx.beginPath(); ctx.arc(x + w / 2, top + 50, 50, 0, Math.PI * 2); ctx.clip();
  ctx.drawImage(img, x + w / 2 - 50, top, 100, 100); ctx.restore();
  return 60 + 10 + bh + 10;
}
function drawShop(ctx, t) {
  drawArt(ctx, t);
  const total = 20 + 32 + 330;
  let y = (H - total) / 2;
  ctx.fillStyle = '#fff'; ctx.font = `bold 20px ${FONT}`; ctx.textBaseline = 'top';
  ctx.fillText('Best choice', 5 + 16, y + 16);
  y += 52;
  const cw = (W - 10) / 2;
  drawOption(ctx, 5, y, cw, 'Robusta beans', 'A strong, bold flavor and high caffeine content.', 15);
  drawOption(ctx, 5 + cw, y, cw, 'Arabica beans', 'Experience a smooth, low acidity flavor in your coffee.', 12);
}

// ---------- Floating Beans ----------
function makeBeans(seed) {
  const r = rng(seed), out = [];
  for (let i = 0; i < 50; i++) out.push({ x: r(), y: r(), speed: rand(r, 0.5, 2.0),
    rot: rand(r, 0, 360), dx: rand(r, -0.6, 0.6), dy: rand(r, -0.6, 0.6) });
  return out;
}
const BEANS = makeBeans(3);
const BEAN_L = 5, TAP = 1.4, RESPAWN = TAP + 1.5;
function drawBeans(ctx, t) {
  drawArt(ctx, t);
  const lt = ((t % BEAN_L) + BEAN_L) % BEAN_L;
  const scattering = lt >= TAP && lt < RESPAWN;
  const img = document.getElementById('bean');
  for (const b of BEANS) {
    const p = scattering ? easeInOut(Math.min(1, (lt - TAP) / b.speed)) : 0;
    const px = (b.x + b.dx * p) * W, py = (b.y + b.dy * p) * H;
    // .rotationEffect is applied after .position, so it rotates around the view centre
    ctx.save(); ctx.globalAlpha = 1 - p; ctx.translate(W / 2, H / 2);
    ctx.rotate(b.rot * Math.PI / 180); ctx.translate(-W / 2, -H / 2);
    ctx.drawImage(img, px - 30, py - 30, 60, 60); ctx.restore();
  }
  // touch indicator (recording aid only, not part of the app)
  const since = lt - TAP;
  if (since > -0.25 && since < 0.45) {
    const a = since < 0 ? (since + 0.25) / 0.25 : 1 - since / 0.45;
    ctx.save(); ctx.globalAlpha = 0.55 * a; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(W * 0.5, H * 0.55, 22 + Math.max(0, since) * 30, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
}

// ---------- Rising Steam ----------
const WISPS = (() => { const r = rng(11), out = [];
  for (let i = 0; i < 7; i++) out.push({ x: rand(r, -26, 26), size: rand(r, 18, 32),
    sway: rand(r, 12, 26), dur: rand(r, 2.5, 4.0), delay: i * 0.35 });
  return out; })();
function drawSteam(ctx, t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, rgb(0.12, 0.07, 0.04)); g.addColorStop(1, rgb(0.04, 0.02, 0.01));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;
  for (const w of WISPS) {
    const p = loop(t, w.dur, w.delay, easeOut);
    ctx.save(); ctx.filter = `blur(${7 * S}px)`; ctx.globalAlpha = lerp(0.5, 0, p); ctx.fillStyle = '#fff';
    capsule(ctx, cx + w.x + lerp(-w.sway, w.sway, p), cy + lerp(-55, -190, p), w.size * 0.5, w.size);
    ctx.restore();
  }
  cupAndSaucer(ctx, cx, cy, 140, BROWN);
}

// ---------- Reveal Cup ----------
const CUP_L = 4.4, SHOW = 0.8, HIDE = 2.8;
function drawReveal(ctx, t) {
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  const lt = ((t % CUP_L) + CUP_L) % CUP_L;
  const shown = lt >= SHOW && lt < HIDE;
  const p = lt < SHOW ? 0 : lt < HIDE ? spring(lt - SHOW) : 1 - spring(lt - HIDE);
  const btnH = 20 + 32, expanded = btnH + 8 + 132;
  const total = lerp(btnH, expanded, p), top = (H - total) / 2;
  ctx.font = `bold 17px ${FONT}`;
  const label = shown ? 'Hide Coffee' : 'Show Coffee';
  const bw = ctx.measureText(label).width + 32;
  const press = [SHOW, HIDE].some(k => lt > k - 0.12 && lt < k + 0.08);
  ctx.fillStyle = BROWN; ctx.globalAlpha = press ? 0.7 : 1;
  ctx.beginPath(); ctx.roundRect(W / 2 - bw / 2, top, bw, btnH, 8); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  ctx.fillText(label, W / 2, top + btnH / 2); ctx.textAlign = 'left'; ctx.globalAlpha = 1;
  if (p > 0.001) {
    const ccy = top + btnH + 8 + 66;
    ctx.save(); ctx.translate(W / 2, ccy); ctx.scale(p, p);
    cupAndSaucer(ctx, 0, 0, 100, BROWN); ctx.restore();
  }
}

// ---------- Doughnut Card ----------
const SPRINKLE_COLORS = ['rgb(255,45,85)', 'rgb(255,204,0)', 'rgb(0,199,190)', '#fff', 'rgb(255,149,0)', 'rgb(50,173,230)'];
function makeSprinkles(seed) { const r = rng(seed), out = [];
  for (let i = 0; i < 14; i++) out.push({ angle: rand(r, 0, 360), dist: rand(r, 0.58, 0.82),
    tilt: rand(r, 0, 180), color: SPRINKLE_COLORS[Math.floor(r() * 6)] });
  return out; }
const SPR_BIG = makeSprinkles(21), SPR_SMALL = makeSprinkles(42);
function doughnut(ctx, cx, cy, side, t, sprinkles) {
  const spin = (t / 14) * 360, bob = lerp(8, -8, pingPong(t, 2.2, 0, easeInOut));
  const R = side / 2, rad = Math.PI / 180;
  ctx.save(); ctx.translate(cx, cy + bob); ctx.rotate(spin * rad);
  const ring = (r, color) => { ctx.fillStyle = color; ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.arc(0, 0, r * 0.42, 0, Math.PI * 2); ctx.fill('evenodd'); };
  ring(R, 'rgb(199,140,89)');
  ctx.save(); ctx.translate(0, -side * 0.03); ring(R * 0.92, 'rgb(77,41,20)'); ctx.restore();
  for (const s of sprinkles) {
    ctx.save(); ctx.translate(0, -side * 0.03); ctx.rotate(s.angle * rad);
    ctx.translate(0, -R * s.dist); ctx.rotate(s.tilt * rad); ctx.fillStyle = s.color;
    capsule(ctx, 0, 0, side * 0.025, side * 0.07); ctx.restore();
  }
  ctx.restore();
}
function drawDoughnut(ctx, t) {
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  const x0 = 32, cw = W - 64;
  ctx.font = `15px ${FONT}`;
  const lines = wrap(ctx, 'Decadent doughnut to satisfy your sweet tooth.', cw - 32 - 58);
  const cardH = 16 + 20 + lines.length * 19 + 30 + 16;
  const total = 180 + 28 + 24 + cardH, top = (H - total) / 2;
  doughnut(ctx, W / 2, top + 90, 180, t, SPR_BIG);
  let y = top + 180 + 28;
  ctx.textBaseline = 'top'; ctx.fillStyle = '#000'; ctx.font = `bold 17px ${FONT}`;
  ctx.fillText('Gift of flavor', x0, y); y += 24;
  ctx.fillStyle = 'rgb(242,242,247)'; ctx.beginPath(); ctx.roundRect(x0, y, cw, cardH, 10); ctx.fill();
  doughnut(ctx, x0 + 16 + 25, y + cardH / 2, 50, t, SPR_SMALL);
  let ty = y + 16; const tx = x0 + 16 + 58;
  ctx.fillStyle = '#000'; ctx.font = `bold 17px ${FONT}`; ctx.fillText('Chocolate doughnut', tx, ty); ty += 22;
  ctx.fillStyle = 'rgb(142,142,147)'; ctx.font = `15px ${FONT}`;
  lines.forEach((l, i) => ctx.fillText(l, tx, ty + i * 19)); ty += lines.length * 19 + 4;
  ctx.fillStyle = BROWN; ctx.font = `22px ${FONT}`; ctx.fillText('$5', tx, ty);
}

// ---------- recording ----------
// Each demo: draw fn, loop length L, crossfade C (blends the tail into the head
// so the GIF loops seamlessly), and a warm-up offset T0 so we start mid-animation.
const DEMOS = {
  'coffee-shop':    { draw: drawShop,     L: 6,     C: 1.2, T0: 4 },
  'floating-beans': { draw: drawBeans,    L: BEAN_L, C: 0.8, T0: 4 * BEAN_L },
  'coffee-art':     { draw: drawArt,      L: 6,     C: 1.2, T0: 4 },
  'rising-steam':   { draw: drawSteam,    L: 4,     C: 0.8, T0: 6 },
  'reveal-cup':     { draw: drawReveal,   L: CUP_L, C: 0,   T0: 0 },
  'doughnut-card':  { draw: drawDoughnut, L: 14,    C: 0.8, T0: 0 },
};
const out = document.getElementById('out');
out.width = OUT_W; out.height = OUT_H;
const scratch = document.createElement('canvas'); scratch.width = OUT_W; scratch.height = OUT_H;
function paint(canvas, demo, t) {
  const c = canvas.getContext('2d'); c.setTransform(S, 0, 0, S, 0, 0);
  c.filter = 'none'; c.globalAlpha = 1; demo.draw(c, t);
}
window.frame = (name, t) => {
  const d = DEMOS[name];
  paint(out, d, d.T0 + t);
  if (t < d.C) {
    paint(scratch, d, d.T0 + t + d.L);
    const c = out.getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0);
    c.filter = 'none'; c.globalAlpha = 1 - t / d.C; c.drawImage(scratch, 0, 0); c.globalAlpha = 1;
  }
  return out.toDataURL('image/png');
};
window.meta = name => ({ L: DEMOS[name].L });
</script>
</body></html>
